<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Membrane</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div class="brand">
          <svg class="logo-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 21L3 4L12 13" stroke="currentColor" stroke-width="2.5"/>
            <path d="M12 13L21 4L21 21" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 1.5"/>
            <circle cx="12" cy="13" r="1.5" fill="#2dd4bf"/>
          </svg>
          <span class="logo-text">Membrane</span>
        </div>
        <div class="header-actions">
          <button id="save-current" type="button" class="btn-icon" title="Save Current Chat" aria-label="Save Current Chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5v14"/>
              <path d="M5 12h14"/>
            </svg>
          </button>
          <button id="refresh" type="button" class="btn-icon" title="Refresh" aria-label="Refresh">
            <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
            </svg>
          </button>
        </div>
      </header>
      <div id="status" class="status-bar" role="status"></div>
      <div id="contexts" class="context-list"></div>
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 21L3 4L12 13" stroke="currentColor" stroke-width="2.5"/>
            <path d="M12 13L21 4L21 21" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 1.5"/>
            <circle cx="12" cy="13" r="1.5" fill="#2dd4bf"/>
          </svg>
        </div>
        <p class="empty-title">No contexts yet</p>
        <p class="empty-desc">Open a supported AI chat and click <strong>Save Context</strong> to get started.</p>
      </div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
